# Konfigurasi Supabase CLI untuk repository ini.
#
# `verify_jwt = false` pada `delete-account` TIDAK menghapus autentikasi.
# Fungsi itu tetap memverifikasi access token pengguna sendiri lewat
# `auth.getUser(token)` sebelum menjalankan langkah apa pun, dan tetap
# membalas 401 untuk permintaan tanpa token maupun dengan token yang tidak
# sah. Pemeriksaan platform hanya dinonaktifkan supaya fungsi tidak
# bergantung pada pemahaman platform terhadap suatu format key tertentu
# saat memanggil handler.
#
# Lihat docs/PRODUCTION_MIGRATION_PLAN.md bagian 0.1.

version = "1"

[auth]
# RodaKawan tidak punya akun: setiap perangkat membuat satu identitas anonim.
# Tanpa ini, `signInAnonymously()` ditolak dengan `anonymous_provider_disabled`.
# Aktifkan juga di project yang sudah berjalan lewat dashboard:
# Authentication → Sign In / Providers → Anonymous sign-ins.
enable_anonymous_sign_ins = true

[auth.email]
# Tidak ada layar daftar/login/reset di aplikasi. Provider email dimatikan agar
# permukaan serangan tidak melebar dan tidak ada jalur masuk berbasis email.
enable_signup = false

[functions.delete-account]
verify_jwt = false

name: CI

# Pemeriksaan otomatis Milestone 1.5.
#
# Tiga job yang sengaja dipisah:
# - `quality`   : seluruh pemeriksaan yang dapat dijalankan TANPA backend. Job ini
#                 tidak memakai satu pun secret Supabase, dan justru membuktikan
#                 aplikasi tetap bisa di-typecheck, di-test, dan dibundel ketika
#                 konfigurasi backend belum ada (docs/QA_TEST_PLAN.md AUTH-13).
# - `workflows-lint`: pemeriksaan file workflow miliknya sendiri. File di
#                 `.github/workflows/` tidak dijangkau tsc/eslint/prettier, dan
#                 kesalahan YAML atau `${{ }}` yang salah baru terlihat saat
#                 workflow itu berjalan — yaitu tepat pada rilis, setelah menit build
#                 terpakai. Job ini memindahkan kegagalan itu ke pull request.
#
# Uji RLS terhadap database development **tidak** ada di sini: kini berdiri sendiri
# di `.github/workflows/database-rls.yml`, karena ia satu-satunya pemeriksaan yang
# membutuhkan secret Supabase. Memisahkannya membuat janji "workflow ini tidak
# memakai satu pun secret" tetap bisa dibaca dari strukturnya.
#
# Aturan yang dipegang: workflow ini tidak pernah menampilkan nilai environment
# (tidak ada `echo $DATABASE_URL`, tidak ada `env` tanpa filter).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pemeriksaan lokal (tanpa backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          # `engines.node` di package.json adalah ">=22.13.0"; CI memakai 24.x
          # supaya sama dengan versi yang dipakai saat memverifikasi secara lokal.
          node-version: '24.x'
          cache: npm

      - name: Pasang dependency dari lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit & komponen test
        run: npm test -- --ci

      # Test script rilis (pengelompokan catatan rilis dan pemilihan rentang
      # commit) memakai runner bawaan Node, bukan Jest: berkasnya .mjs dan
      # sengaja menjalankan git sungguhan di repo sementara.
      - name: Unit test script rilis (node:test)
        run: npm run test:scripts

      - name: Expo doctor
        run: npm run doctor

      - name: Bundel Android (Metro + Hermes)
        run: npm run export:android

  workflows-lint:
    name: Lint file workflow (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Container resmi actionlint sudah memuat actionlint, shellcheck, dan pyflakes
      # (tercantum di dokumentasi usage proyek itu), sehingga `run:` block tiap job
      # ikut diperiksa shellcheck tanpa langkah instalasi tambahan. Versinya dipin
      # bukan `latest`: perubahan aturan lint tidak boleh memutuskan pull request
      # yang semijauh ini belum disentuh — naikkan versinya sebagai perubahan biasa.
      - name: Periksa sintaks YAML, ekspresi, dan shell di seluruh workflow
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # Jangan menambahkan `-shellcheck=""` di sini: flag itu berarti
          # **mematikan** integrasi shellcheck. Dengan argumen minimal ini,
          # actionlint mencari shellcheck di PATH — dan ada di dalam container.
          args: -color=false

# Uji RLS terhadap database development **tidak** ada di workflow ini. Ia pindah ke
# `.github/workflows/database-rls.yml` dengan trigger terbatas pada file database
# (plus dispatch manual), karena butuh secret `DB_TEST_DATABASE_URL` — satu-satunya
# secret yang tidak boleh disentuh `ci.yml`.
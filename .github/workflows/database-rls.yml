name: Database RLS

# Pemeriksaan aturan database (RLS + RPC) terhadap project Supabase **development**.
#
# Kenapa workflow terpisah dari `ci.yml`:
# `ci.yml` sengaja dibuat agar job `quality` tidak pernah menyentuh secret Supabase
# apa pun — di sana buktinya bahwa aplikasi tetap bisa diperiksa tanpa backend.
# Workflow ini adalah kebalikannya: **satu-satunya** tujuannya menjalankan uji yang
# membutuhkan kredensial database, jadi dipisah agar batasnya terlihat sekilas, bukan
# tersembunyi di balik satu baris `if:`.
#
# Kenapa berjalan otomatis (bukan lagi hanya manual):
# Sebelumnya job ini hanya bisa dijalankan lewat **Actions → Run workflow** dengan
# input `run_db_tests`, sehingga perubahan migration yang melanggar aturan privasi
# bisa lolos: pemeriksaan lain (typecheck, lint, jest) tidak tahu apa pun tentang
# policy. Agar tetap murah dan tidak menyalahgunakan database development, trigger
# otomatisnya **dibatasi pada file yang memang mengubah perilaku database**:
#
#   - `supabase/**`           — migration dan berkas uji RLS (`supabase/tests/`)
#   - `scripts/db-test.mjs`   — runner yang membaca dan menafsirkan hasilnya
#   - `scripts/check-test-uuid-literals.mjs` dan `scripts/lib/sql-uuid-literals.mjs`
#                             — pemeriksaan statis literal UUID yang dijalankan
#                               runner sebagai pra-syarat
#   - `scripts/db-types.mjs` dan `src/lib/supabase/database.*.ts`
#                             — sumber dan hasil generate tipe database
#   - workflow ini sendiri    — perubahan aturannya harus teruji
#
# Aturan yang dipegang (sama seperti sebelumnya):
# - Nilai secret **tidak pernah** dicetak: hanya dicek keberadaannya.
# - Sebelum uji dijalankan, connection string diverifikasi menunjuk **project
#   development** (ref `xvmcpfkkveeaevfcvfug`). Selain itu workflow berhenti,
#   sehingga secret yang salah tempat tidak bisa menjalankan uji apa pun.
# - Setiap berkas uji di `supabase/tests/` membungkus seluruh asersinya dalam
#   transaksi yang di-ROLLBACK, sehingga menjalankannya ulang tidak menghapus atau
#   meninggalkan data apa pun.
# - Berkas kedua adalah pagar katalog policy: gagal bila ada policy pada tabel wadah
#   yang memberi akses lewat kolom kepemilikan (created_by/author_id/owner_id/…) tanpa
#   penjaga keanggotaan. Detektornya diuji-diri di dalam berkas itu, dan daftar
#   pengecualiannya diperiksa anti-usang (lihat ADR-060).
# - Tipe database (`database.generated.ts`) diperiksa terhadap skema yang sama:
#   bila migration sudah diterapkan tetapi tipe belum diregenerasi, langkah
#   `db:types:check` gagal dan menampilkan perbedaan pertama.
# - Pull request dari fork tidak menerima secret sama sekali, jadi jobnya dilewati
#   (bukan digagalkan) — pembaca luar tetap mendapat seluruh pemeriksaan `ci.yml`.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/db-test.mjs'
      - 'scripts/check-test-uuid-literals.mjs'
      - 'scripts/lib/sql-uuid-literals.mjs'
      - 'scripts/db-types.mjs'
      - 'src/lib/supabase/database.generated.ts'
      - 'src/lib/supabase/database.types.ts'
      - '.github/workflows/database-rls.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/db-test.mjs'
      - 'scripts/check-test-uuid-literals.mjs'
      - 'scripts/lib/sql-uuid-literals.mjs'
      - 'scripts/db-types.mjs'
      - 'src/lib/supabase/database.generated.ts'
      - 'src/lib/supabase/database.types.ts'
      - '.github/workflows/database-rls.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-rls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    name: Uji RLS dan tipe database development
    # PR dari fork tidak punya secret; jangan mengagalkan pekerjaan orang yang tidak
    # mungkin memenuhi syarat ini.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          # Sama dengan ci.yml: Node 24.x agar identik dengan pemverifikasi lokal.
          node-version: '24.x'
          cache: npm

      - name: Pasang dependency dari lockfile
        run: npm ci

      # Gerbang keamanan: uji ini menulis (lalu di-ROLLBACK) terhadap database sungguhan,
      # jadi targetnya harus diketahui benar **sebelum** ada satu perintah pun dijalankan
      # terhadapnya. Ref project development adalah berkas publik di repository
      # (tercatat di docs/MILESTONE_2_REPORT.md dan di-`.gitignore` untuk salinan lokalnya).
      - name: Pastikan targetnya database development (nilai tidak dicetak)
        env:
          DATABASE_URL: ${{ secrets.DB_TEST_DATABASE_URL }}
        run: |
          DEV_REF="xvmcpfkkveeaevfcvfug"
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Secret DB_TEST_DATABASE_URL belum diatur. Isi connection string project development (session pooler) di Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "${DATABASE_URL}" in
            *"${DEV_REF}"*) echo "Secret tersedia dan menunjuk project development; isinya tidak ditampilkan." ;;
            *)
              echo "::error::DATABASE_URL tidak menunjuk project development (ref ${DEV_REF}). Uji ini menolak berjalan terhadap project lain."
              exit 1
              ;;
          esac

      # Dijalankan satu kali dan hasilnya dicetak apa adanya. Selain keluar non-nol bila
      # asersi gagal, keluaran harus memuat notice penanda dari **setiap** berkas uji:
      #
      #   - `UJI RLS PROFIL LULUS`         — aturan izin/penolakan per tabel dan Storage
      #   - `UJI POLICY OWNER-GUARD LULUS`  — tidak ada policy wadah yang memberi akses
      #     lewat kolom kepemilikan tanpa penjaga keanggotaan (ADR-060)
      #   - `UJI RLS PERJALANAN M3 LULUS`   — state machine, consent, dan pembersihan
      #     lokasi perjalanan (ADR-065)
      #   - `UJI RLS LAKUAN M4 LULUS`       — laporan bahaya: RPC, expiry server, rate
      #     limit, dan jalur tulis tertutup (Milestone 4)
      #   - `UJI RLS CHAT M4 LULUS`         — chat konvoi: idempotensi, jendela edit,
      #     rate limit, pesan sistem, dan ride final (Milestone 4)
      #   - `UJI MODERASI M4 LULUS`         — antrean moderasi, aksi hapus, dan audit
      #     sesuai wewenang host/admin klub (Milestone 4)
      #   - `UJI FILTER BLOKIR CHAT LULUS`  — pesan teks pengguna yang diblokir tidak
      #     pernah terkirim ke pemblokir (ADR-068, Milestone 4)
      #
      # Runner "hijau palsu" (mis. berkas uji terpotong) tidak bisa lolos karena
      # `scripts/db-test.mjs` hanya melaporkan lulus bila notice itu benar-benar diterima;
      # pemeriksaan kedua di sini menjaga jalur yang sama bila runner itu sendiri berubah.
      - name: Jalankan uji RLS dan pastikan semua penanda lulus diterima
        env:
          DATABASE_URL: ${{ secrets.DB_TEST_DATABASE_URL }}
        run: |
          OUTPUT="$(npm run db:test 2>&1)" || STATUS=$?
          printf '%s\n' "${OUTPUT}"
          MISSING=""
          case "${OUTPUT}" in
            *"UJI RLS PROFIL LULUS"*) ;;
            *) MISSING="${MISSING} UJI RLS PROFIL LULUS" ;;
          esac
          case "${OUTPUT}" in
            *"UJI POLICY OWNER-GUARD LULUS"*) ;;
            *) MISSING="${MISSING} UJI POLICY OWNER-GUARD LULUS" ;;
          esac
          case "${OUTPUT}" in
            *"UJI RLS PERJALANAN M3 LULUS"*) ;;
            *) MISSING="${MISSING} UJI RLS PERJALANAN M3 LULUS" ;;
          esac
          case "${OUTPUT}" in
            *"UJI RLS LAKUAN M4 LULUS"*) ;;
            *) MISSING="${MISSING} UJI RLS LAKUAN M4 LULUS" ;;
          esac
          case "${OUTPUT}" in
            *"UJI RLS CHAT M4 LULUS"*) ;;
            *) MISSING="${MISSING} UJI RLS CHAT M4 LULUS" ;;
          esac
          case "${OUTPUT}" in
            *"UJI MODERASI M4 LULUS"*) ;;
            *) MISSING="${MISSING} UJI MODERASI M4 LULUS" ;;
          esac
          case "${OUTPUT}" in
            *"UJI FILTER BLOKIR CHAT LULUS"*) ;;
            *) MISSING="${MISSING} UJI FILTER BLOKIR CHAT LULUS" ;;
          esac
          if [ -n "${MISSING}" ]; then
            echo "::error::Penanda lulus berikut tidak diterima:${MISSING}. Berkas uji berhenti sebelum seluruh asersi dijalankan."
            exit 1
          fi
          echo "Seluruh penanda lulus diterima dari server."
          exit "${STATUS:-0}"

      # Diperiksa terhadap database yang sama dengan uji RLS: perubahan skema yang
      # sudah diterapkan tetapi belum diikuti `npm run db:types` akan membuat tipe
      # aplikasi tertinggal (kolom/RPC baru tidak dikenal TypeScript). Langkah ini
      # hanya membaca katalog skema; tidak ada data yang diubah.
      - name: Pastikan tipe database tidak menyimpang dari skema
        env:
          DATABASE_URL: ${{ secrets.DB_TEST_DATABASE_URL }}
        run: npm run db:types:check
